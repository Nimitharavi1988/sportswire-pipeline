name: Voice test (no posting)
# Manual only. Runs the exact natural-mode Python from the website code on a GitHub runner and uploads the samples; posts nothing.
on: workflow_dispatch
permissions: { contents: read }
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install kokoro-onnx soundfile numpy
      - name: Samples
        run: |
          mkdir out && cd out
          B=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -sL -o kokoro.onnx "$B/kokoro-v1.0.int8.onnx"; curl -sL -o voices.bin "$B/voices-v1.0.bin"
          for key in clubs_england_spain clubs_italy_france clubs_germany clubs_rest; do
            T=$(python3 -c "import json;print(json.load(open('../.github/data/tts-texts.json'))['$key'])")
            python3 ../.github/data/kokoro_natural.py kokoro.onnx voices.bin bm_george en-gb 1.0 "$key.wav" 42 "$T"
          done
      - uses: actions/upload-artifact@v4
        with: { name: voice-samples, path: out/*.wav }
