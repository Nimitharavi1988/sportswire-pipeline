name: Voice test (no posting)
# Manual only. Tries free offline text-to-speech voices on a GitHub runner and uploads the samples; posts nothing.
on: workflow_dispatch
permissions: { contents: read }
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install kokoro-onnx soundfile
      - name: Samples
        run: |
          mkdir out && cd out
          B=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -sL -o kokoro.onnx "$B/kokoro-v1.0.int8.onnx"; curl -sL -o voices.bin "$B/voices-v1.0.bin"
          cat > k.py <<'PY'
          import json, soundfile as sf
          from kokoro_onnx import Kokoro
          t = json.load(open("../.github/data/tts-texts.json"))
          k = Kokoro("kokoro.onnx", "voices.bin")
          def make(name, key, voice, speed):
              s, sr = k.create(t[key], voice=voice, speed=speed, lang="en-gb" if voice.startswith("b") else "en-us")
              sf.write(f"{name}.wav", s, sr)
              print(f"{name}: {len(s)/sr:.1f} s")
          for key in ["names_cricket_india", "names_cricket_world", "names_mma", "names_boxing_football"]:
              make(f"{key}__bm_george", key, "bm_george", 1.0)
          for v in ["bm_george", "bm_fable", "bm_lewis", "bm_daniel", "am_michael", "am_adam"]:
              make(f"story_mma__{v}", "story_mma", v, 1.05)
          for key in ["story_cricket", "story_football"]:
              for v in ["bm_george", "am_michael"]:
                  make(f"{key}__{v}", key, v, 1.05)
          PY
          python3 k.py
      - uses: actions/upload-artifact@v4
        with: { name: voice-samples, path: out/*.wav }
