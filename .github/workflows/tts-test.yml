name: Voice test (no posting)
# Manual only. Tries free offline text-to-speech voices on a GitHub runner and uploads the samples; posts nothing.
on: workflow_dispatch
permissions: { contents: read }
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install piper-tts
      - name: Samples
        run: |
          mkdir out && cd out
          TEXT="MMA news. Islam Makhachev says his next fight could be among his last, and Merab Dvalishvili, Luka Doncic and Victor Wembanyama are all in the news."
          python3 -m piper.download_voices en_US-ljspeech-medium en_US-libritts_r-medium
          t() { START=$(date +%s.%N); python3 -m piper -m "$1" $3 -f "$2.wav" -- "$TEXT"; END=$(date +%s.%N); echo "$2: $(echo "$END - $START" | bc) s, $(stat -c %s "$2.wav") bytes"; }
          t en_US-ljspeech-medium ljspeech ""
          for S in 10 100 250 400 600; do t en_US-libritts_r-medium libritts_s$S "-s $S"; done
          ls -la
      - uses: actions/upload-artifact@v4
        with: { name: voice-samples, path: out/*.wav }
