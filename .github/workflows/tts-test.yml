name: Voice test (no posting)
# Manual only. Tries free offline text-to-speech voices on a GitHub runner and uploads the samples; posts nothing.
on: workflow_dispatch
permissions: { contents: read }
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install kokoro-onnx soundfile
      - name: Samples
        run: |
          mkdir out && cd out
          TEXT="Cricket news. Kuldeep Yadav may miss the India versus New Zealand eleven. Venue, Eden Gardens."
          B=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -sL -o kokoro.onnx "$B/kokoro-v1.0.int8.onnx"; curl -sL -o voices.bin "$B/voices-v1.0.bin"
          cat > k.py <<'PY'
          import sys, soundfile as sf
          from kokoro_onnx import Kokoro
          text = sys.argv[1]
          k = Kokoro("kokoro.onnx", "voices.bin")
          print("voices:", [v for v in k.get_voices() if v.startswith("b") or v.startswith("a")])
          def make(name, voice, speed=1.1):
              s, sr = k.create(text, voice=voice, speed=speed, lang="en-gb" if name.startswith("gb") else "en-us")
              sf.write(f"{name}.wav", s, sr)
          for v in ["bm_fable", "bm_daniel", "bm_lewis", "bm_george"]:
              make(f"gb_{v}", v)
          for v in ["bm_fable", "bm_daniel", "bm_lewis", "bf_emma"]:
              make(f"gb_blend_george_{v}", k.get_voice_style("bm_george") * 0.5 + k.get_voice_style(v) * 0.5)
          make("gb_george_fast", "bm_george", 1.2)
          PY
          python3 k.py "$TEXT"
          FF=$(python3 -c "import shutil;print(shutil.which('ffmpeg') or '')")
          for P in 1.06 1.12; do
            ffmpeg -loglevel error -y -i gb_bm_george.wav -af "asetrate=24000*$P,aresample=24000,atempo=$(python3 -c "print(1/$P)")" "gb_george_pitch_$P.wav"
          done
          ls -la *.wav
      - uses: actions/upload-artifact@v4
        with: { name: voice-samples, path: out/*.wav }
