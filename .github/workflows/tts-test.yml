name: Voice test (no posting)
# Manual only. Tries free offline text-to-speech voices on a GitHub runner and uploads the samples; posts nothing.
on: workflow_dispatch
permissions: { contents: read }
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install piper-tts
      - name: Samples
        run: |
          mkdir out && cd out
          python3 -m piper.download_voices en_US-ljspeech-medium
          python3 -m piper -m en_US-ljspeech-medium -f reel_voice.wav -- "Cricket news. Kuldeep Yadav may miss the INDvNZ XI. Venue, Eden Gardens."
          ls -la
      - uses: actions/upload-artifact@v4
        with: { name: voice-samples, path: out/*.wav }
