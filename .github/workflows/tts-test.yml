name: Voice test (no posting)
# Manual only. Runs the exact natural-mode Python from the website code on a GitHub runner and uploads the samples; posts nothing.
on: workflow_dispatch
permissions: { contents: read }
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install kokoro-onnx soundfile numpy
      - name: Samples
        run: |
          mkdir out && cd out
          B=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -sL -o kokoro.onnx "$B/kokoro-v1.0.int8.onnx"; curl -sL -o voices.bin "$B/voices-v1.0.bin"
          T1="MMA news. Islaam Mahkahchev has revealed that his upcoming bout will be among the final appearances of his professional fighting career."
          T2="Jusprit Boomrah took four wickets as India beat New Zealand by 28 runs in the first T20I at Eden Gardens."
          run() { python3 ../.github/data/kokoro_natural.py kokoro.onnx voices.bin "$1" "$2" "$3" "$4.wav" "$5" "$6"; python3 -c "import soundfile as sf;d,r=sf.read('$4.wav');print('$4', round(len(d)/r,1),'s')"; }
          run bm_george en-gb 1.05 final_mma_george 42 "$T1"
          run am_michael en-us 1.05 final_cricket_michael 43 "$T2"
          run bm_fable en-gb 1.2 final_mma_fable_fast 44 "$T1"
      - uses: actions/upload-artifact@v4
        with: { name: voice-samples, path: out/*.wav }
