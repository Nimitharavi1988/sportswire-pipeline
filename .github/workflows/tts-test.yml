name: Voice test (no posting)
# Manual only. Tries free offline text-to-speech voices on a GitHub runner and uploads the samples; posts nothing.
on: workflow_dispatch
permissions: { contents: read }
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install kokoro-onnx soundfile numpy
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Samples
        run: |
          mkdir out && cd out
          B=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -sL -o kokoro.onnx "$B/kokoro-v1.0.int8.onnx"; curl -sL -o voices.bin "$B/voices-v1.0.bin"
          cat > k.py <<'PY'
          import json, random, re, numpy as np, soundfile as sf
          from kokoro_onnx import Kokoro
          t = json.load(open("../.github/data/tts-texts.json"))
          k = Kokoro("kokoro.onnx", "voices.bin")

          def trim(s, sr, thr=0.012, pad=0.03):
              idx = np.where(np.abs(s) > thr)[0]
              if len(idx) == 0: return s
              a = max(0, idx[0] - int(sr * pad)); b = min(len(s), idx[-1] + int(sr * pad))
              return s[a:b]

          def natural(text, voice, base=1.05, seed=1, level=1.0):
              rnd = random.Random(seed)
              lang = "en-gb" if voice.startswith("b") else "en-us"
              parts = [p.strip() for p in re.findall(r"[^.,;:!?]+[.,;:!?]?", text) if p.strip()]
              out = []; sr = 24000
              for i, p in enumerate(parts):
                  end = p[-1] if p[-1] in ".,;:!?" else "."
                  sp = base * rnd.uniform(0.96, 1.06)
                  if i == 0: sp *= 0.96              # the opener: a touch slower and crisper
                  if end in ".!?": sp *= 0.95        # sentences settle as they end
                  pitch = 1 + level * rnd.uniform(-0.03, 0.04)   # small pitch drift per phrase
                  s, sr = k.create(p, voice=voice, speed=sp / pitch, lang=lang)
                  # resampling by `pitch` raises or lowers the pitch while keeping the pace set above
                  n = int(len(s) / pitch)
                  s = np.interp(np.linspace(0, len(s) - 1, n), np.arange(len(s)), s)
                  s = trim(s, sr) * (10 ** (rnd.uniform(-1.2, 1.2) * level / 20))
                  gap = {",": rnd.uniform(0.12, 0.26), ";": rnd.uniform(0.18, 0.30), ":": rnd.uniform(0.18, 0.30),
                         ".": rnd.uniform(0.32, 0.52), "!": rnd.uniform(0.30, 0.50), "?": rnd.uniform(0.34, 0.54)}[end]
                  out += [s, np.zeros(int(sr * gap))]
              return np.concatenate(out[:-1]), sr

          def save(name, key, voice, seed):
              s, sr = natural(t[key], voice, seed=seed)
              sf.write(f"{name}.wav", s, sr); print(f"{name}: {len(s)/sr:.1f} s")
          for v in ["bm_george", "bm_fable", "bm_lewis", "am_michael"]:
              save(f"natural_story_mma__{v}", "story_mma", v, 7)
          for key in ["story_cricket", "story_football"]:
              for v in ["bm_george", "am_michael"]:
                  save(f"natural_{key}__{v}", key, v, 11)
          PY
          python3 k.py
          # a light broadcast polish on one of them for comparison: gentle compression, a little presence, loudness
          ffmpeg -loglevel error -y -i natural_story_mma__bm_george.wav -af "acompressor=threshold=-20dB:ratio=2.5:attack=8:release=120,equalizer=f=3000:t=q:w=1:g=2,equalizer=f=120:t=q:w=1:g=1.5,loudnorm=I=-18:TP=-2" polished_story_mma__bm_george.wav
          ls -la *.wav
      - uses: actions/upload-artifact@v4
        with: { name: voice-samples, path: out/*.wav }
