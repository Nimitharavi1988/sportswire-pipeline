name: Ingestion cron

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ingestion
  cancel-in-progress: false

jobs:
  run-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Wikimedia photo lookups (src/lib/ingestion/wikimediaImages.ts): wait out a rate-limit refusal, and keep a lookup cache between runs.
      WIKIMEDIA_WAIT: "1"
      FFMPEG_PATH: /usr/bin/ffmpeg
      PHOTO_CACHE_FILE: ${{ github.workspace }}/.photo-cache/photos.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Install scripts are skipped: ffmpeg-static downloads its binary from GitHub's release servers, which returned 504 for hours on 2026-11-08 and stopped
      # every run. ffmpeg comes from the Ubuntu package instead (FFMPEG_PATH, src/lib/social/reel.tsx). Of the packages with install scripts only esbuild
      # remains, and it works without its script (its platform binary is an optional dependency).
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            npm ci --ignore-scripts && break
            [ "$attempt" = "3" ] && exit 1
            echo "npm ci failed (attempt $attempt), retrying"; sleep $((attempt * 20))
          done
          for attempt in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && break
            [ "$attempt" = "3" ] && exit 1
            echo "apt install ffmpeg failed (attempt $attempt), retrying"; sleep $((attempt * 15))
          done
          ffmpeg -version | head -1
      - name: Photo lookup cache
        uses: actions/cache@v4
        with:
          path: .photo-cache
          key: photo-cache-${{ github.run_id }}
          restore-keys: photo-cache-
      - run: npx tsx src/lib/ingestion/runIngest.ts
        timeout-minutes: 20
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          CRICKETDATA_API_KEY: ${{ secrets.CRICKETDATA_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_ROUTER: ${{ vars.LLM_ROUTER }}
          LLM_DISABLE: ${{ vars.LLM_DISABLE }}
          LLM_PAID_DAILY_CALLS: ${{ vars.LLM_PAID_DAILY_CALLS }}
          DAILY_NEWS_COMMENTARY_CAP: ${{ vars.DAILY_NEWS_COMMENTARY_CAP }}
          INGEST_CONCURRENCY: ${{ vars.INGEST_CONCURRENCY }}
          MIN_GROUNDING_CHARS: ${{ vars.MIN_GROUNDING_CHARS }}
          GEMINI_FREE_API_KEY: ${{ secrets.GEMINI_FREE_API_KEY }}
          GEMINI_FREE_API_KEY_2: ${{ secrets.GEMINI_FREE_API_KEY_2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - if: ${{ !cancelled() }}
        run: npx tsx src/lib/videos/youtubeSync.ts
        timeout-minutes: 10
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - if: ${{ !cancelled() }}
        run: npx tsx src/lib/snapshots/sync.ts
        timeout-minutes: 10
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      - if: ${{ !cancelled() }}
        run: npx tsx src/lib/events/syncEventData.ts
        timeout-minutes: 10
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Voice pilot (voiceover.ts): only when the repo variable VOICEOVER_PAGES lists a Page. Free offline Kokoro voices (Apache 2.0).
      - name: Voice setup (Python)
        if: ${{ !cancelled() && vars.VOICEOVER_PAGES != '' }}
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Voice model cache
        if: ${{ !cancelled() && vars.VOICEOVER_PAGES != '' }}
        uses: actions/cache@v4
        with:
          path: ~/kokoro
          key: kokoro-v1.0-int8
      - name: Voice (Kokoro)
        if: ${{ !cancelled() && vars.VOICEOVER_PAGES != '' }}
        continue-on-error: true
        run: |
          pip install kokoro-onnx soundfile
          mkdir -p ~/kokoro
          B=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -s ~/kokoro/kokoro.onnx ] || curl -sfL -o ~/kokoro/kokoro.onnx "$B/kokoro-v1.0.int8.onnx"
          [ -s ~/kokoro/voices.bin ] || curl -sfL -o ~/kokoro/voices.bin "$B/voices-v1.0.bin"
          echo "KOKORO_MODEL=$HOME/kokoro/kokoro.onnx" >> "$GITHUB_ENV"
          echo "KOKORO_VOICES=$HOME/kokoro/voices.bin" >> "$GITHUB_ENV"
      - if: ${{ !cancelled() }}
        run: npx tsx src/lib/ingestion/autoApprove.ts
        timeout-minutes: 30
        env:
          VOICEOVER_PAGES: ${{ vars.VOICEOVER_PAGES }}
          FALLBACK_CARD_CATEGORIES: ${{ vars.FALLBACK_CARD_CATEGORIES }}
          MAIN_CAPTION_KEYWORD: ${{ vars.MAIN_CAPTION_KEYWORD }}
          REGION_SCHEDULE: ${{ vars.REGION_SCHEDULE }}
          REEL_PACING: ${{ vars.REEL_PACING }}
          INSTAGRAM_PAUSED_ACCOUNTS: ${{ vars.INSTAGRAM_PAUSED_ACCOUNTS }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_ROUTER: ${{ vars.LLM_ROUTER }}
          LLM_DISABLE: ${{ vars.LLM_DISABLE }}
          LLM_PAID_DAILY_CALLS: ${{ vars.LLM_PAID_DAILY_CALLS }}
          GEMINI_FREE_API_KEY: ${{ secrets.GEMINI_FREE_API_KEY }}
          GEMINI_FREE_API_KEY_2: ${{ secrets.GEMINI_FREE_API_KEY_2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_REFRESH_TOKEN_ES: ${{ secrets.YOUTUBE_REFRESH_TOKEN_ES }}
          YOUTUBE_SHORTS_ENABLED: ${{ vars.YOUTUBE_SHORTS_ENABLED }}
          YOUTUBE_MAX_PER_DAY: ${{ vars.YOUTUBE_MAX_PER_DAY }}
          YOUTUBE_MAX_PER_DAY_ES: ${{ vars.YOUTUBE_MAX_PER_DAY_ES }}
          YOUTUBE_ES_HOURS_UTC: ${{ vars.YOUTUBE_ES_HOURS_UTC }}
          YOUTUBE_MIN_GAP_MINUTES: ${{ vars.YOUTUBE_MIN_GAP_MINUTES }}
          REEL_MAX_AGE_HOURS: ${{ vars.REEL_MAX_AGE_HOURS }}
          FACEBOOK_PAGE_2_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_2_ACCESS_TOKEN }}
          FACEBOOK_ES_ENABLED: ${{ vars.FACEBOOK_ES_ENABLED }}
          FACEBOOK_PAGE_ES_ID: ${{ vars.FACEBOOK_PAGE_ES_ID }}
          FACEBOOK_PAGE_ES_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ES_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
      - if: ${{ !cancelled() }}
        run: npx tsx src/lib/stories/autoDraft.ts
        timeout-minutes: 25
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_ROUTER: ${{ vars.LLM_ROUTER }}
          LLM_DISABLE: ${{ vars.LLM_DISABLE }}
          LLM_PAID_DAILY_CALLS: ${{ vars.LLM_PAID_DAILY_CALLS }}
          GEMINI_FREE_API_KEY: ${{ secrets.GEMINI_FREE_API_KEY }}
          GEMINI_FREE_API_KEY_2: ${{ secrets.GEMINI_FREE_API_KEY_2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - if: ${{ !cancelled() }}
        run: npx tsx src/lib/stories/enrich.ts
        timeout-minutes: 15
        env:
          ENRICH_MAX_PER_DAY: ${{ vars.ENRICH_MAX_PER_DAY }}
          ENRICH_MAX_PER_RUN: ${{ vars.ENRICH_MAX_PER_RUN }}
          ENRICH_MAX_RESEARCH_PER_RUN: ${{ vars.ENRICH_MAX_RESEARCH_PER_RUN }}
          ENRICH_SHORT_MAX_PER_DAY: ${{ vars.ENRICH_SHORT_MAX_PER_DAY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_ROUTER: ${{ vars.LLM_ROUTER }}
          LLM_DISABLE: ${{ vars.LLM_DISABLE }}
          LLM_PAID_DAILY_CALLS: ${{ vars.LLM_PAID_DAILY_CALLS }}
          GEMINI_FREE_API_KEY: ${{ secrets.GEMINI_FREE_API_KEY }}
          GEMINI_FREE_API_KEY_2: ${{ secrets.GEMINI_FREE_API_KEY_2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      - if: ${{ !cancelled() }}
        run: npx tsx src/lib/translation/translateArticles.ts
        timeout-minutes: 20
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_ROUTER: ${{ vars.LLM_ROUTER }}
          LLM_DISABLE: ${{ vars.LLM_DISABLE }}
          LLM_PAID_DAILY_CALLS: ${{ vars.LLM_PAID_DAILY_CALLS }}
          GEMINI_FREE_API_KEY: ${{ secrets.GEMINI_FREE_API_KEY }}
          GEMINI_FREE_API_KEY_2: ${{ secrets.GEMINI_FREE_API_KEY_2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TRANSLATION_LOCALES: ${{ vars.TRANSLATION_LOCALES }}
          LIVE_LOCALES: ${{ vars.LIVE_LOCALES }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

# Started by an external scheduler through the dispatch API; see README.md.
