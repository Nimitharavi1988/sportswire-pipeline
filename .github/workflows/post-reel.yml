name: Post reel

on:
  workflow_dispatch:
    inputs:
      article_id:
        description: "Article ID to post"
        required: true
      music:
        description: "Music style"
        required: false
        default: auto
        type: choice
        options: [auto, drive, anthem, trap, chill, smooth, ambient, cinematic, hype, dance, lofi, epic, groove]
      theme:
        description: "Colour theme"
        required: false
        default: auto
        type: choice
        options: [auto, green, blue, orange, red, purple, gold]
      topic_page:
        description: "Post to a topic Facebook Page only (no Instagram / main Page)"
        required: false
        default: none
        type: choice
        options: [none, india-cricket, cricketlive]
      font:
        description: "Headline font"
        required: false
        default: poppins
        type: choice
        options: [poppins, oswald, bebas, montserrat]

permissions:
  contents: read

jobs:
  post-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsx src/lib/social/postReelJob.ts
        env:
          ARTICLE_ID: ${{ inputs.article_id }}
          MUSIC: ${{ inputs.music }}
          THEME: ${{ inputs.theme }}
          FONT: ${{ inputs.font }}
          TOPIC_PAGE: ${{ inputs.topic_page }}
          FACEBOOK_PAGE_2_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_2_ACCESS_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_ROUTER: ${{ vars.LLM_ROUTER }}
          LLM_DISABLE: ${{ vars.LLM_DISABLE }}
          LLM_PAID_DAILY_CALLS: ${{ vars.LLM_PAID_DAILY_CALLS }}
          GEMINI_FREE_API_KEY: ${{ secrets.GEMINI_FREE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_REFRESH_TOKEN_ES: ${{ secrets.YOUTUBE_REFRESH_TOKEN_ES }}
          YOUTUBE_SHORTS_ENABLED: ${{ vars.YOUTUBE_SHORTS_ENABLED }}
          YOUTUBE_MAX_PER_DAY: ${{ vars.YOUTUBE_MAX_PER_DAY }}
          YOUTUBE_MIN_GAP_MINUTES: ${{ vars.YOUTUBE_MIN_GAP_MINUTES }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
