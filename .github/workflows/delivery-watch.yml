name: Delivery watch

on:
  schedule: [{ cron: "40 * * * *" }]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: delivery-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # ffmpeg-static downloads its binary from GitHub during install; that download fails now and then (2026-11-08: 4 of 5 runs), so retry.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3 4; do
            npm ci && exit 0
            echo "npm ci failed (attempt $attempt), retrying"
            sleep $((attempt * 20))
          done
          exit 1
      - run: npx tsx scripts/deliveryWatch.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

# Started by an external scheduler through the dispatch API; see README.md.
